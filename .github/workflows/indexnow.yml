name: IndexNow after production deployment

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last accepted page fingerprints
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/indexnow/restore-state.mjs
      - name: Verify production and notify Bing
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha || github.sha }}
        run: node scripts/indexnow/submit.mjs
      - name: Save fingerprints only after successful submission
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: .indexnow-state/pages.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
